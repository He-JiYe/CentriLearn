# configs/CentriLearn.yaml

algorithm:
  type: PPO
  model_cfg:
    type: ActorCritic
    backbone_cfg:
      type: GraphSAGE
      in_channels: 1
      hidden_channels: 128
      num_layers: 3
    actor_head_cfg:
      type: LocalPolicyHead
      in_channels: 128
    critic_head_cfg:
      type: ComponentValueHead
      in_channels: 128
    num_critics: 2
  optimizer_cfg:
    type: AdamW
    lr: 0.0001
    weight_decay: 0.0005
  scheduler_cfg:
    type: "LinearLR"
    start_factor: 1
    end_factor: 0.1
    total_iters: 2000
  replaybuffer_cfg:
    type: RolloutBuffer
  metric_manager_cfg:
    metrics:
      - type: AUC
        record: min
      - type: AttackRate
        record: min
  algo_cfg:
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    entropy_coef: 0.01
    value_coef: 1
    rcst_coef: 0.0001
    max_grad_norm: 2
    num_epochs: 1
  device: cuda

environment:
  type: NetworkDismantlingEnv
  synth_type: ba
  synth_args:
    min_n: 30
    max_n: 50
    m: 4
  node_features: degree
  node_dim: 1
  is_undirected: True
  value_type: ar
  use_component: True
  device: cuda

training:
  seed: 42
  use_gcc: False
  num_episodes: 2000
  num_update: 2
  max_steps: 10000
  batch_size: 64
  log_interval: 100
  save_interval: 1000

test:
  seed: 42
  data_dir: .\data\test
  use_gcc: True
